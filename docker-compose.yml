services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - OPEN_ROUTER_API_KEY=${OPEN_ROUTER_API_KEY}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: https://collectivedetails.org/world-builder/api
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
